name: Build DropShare Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed | grep -E 'platforms;android-36|build-tools;36.0.0|platform-tools' || true

      - name: Download bundled gesture model
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 5 --retry-delay 2 --connect-timeout 30 --max-time 180 \
            "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task" \
            -o app/src/main/assets/gesture_recognizer.task
          test "$(wc -c < app/src/main/assets/gesture_recognizer.task)" -gt 1000000

      - name: Validate Gradle project
        run: gradle --no-daemon --stacktrace :app:tasks --all >/dev/null

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Run Android lint
        run: gradle --no-daemon --stacktrace lintDebug

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Create temporary CI signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore ci-keystore.jks \
            -storepass dropshare-ci \
            -keypass dropshare-ci \
            -alias dropshare \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=DropShare CI, OU=Build, O=DropShare, L=Unknown, ST=Unknown, C=NG"

      - name: Build installable CI release APK
        run: |
          gradle --no-daemon --stacktrace assembleRelease \
            -PciStoreFile="$GITHUB_WORKSPACE/ci-keystore.jks" \
            -PciStorePassword=dropshare-ci \
            -PciKeyAlias=dropshare \
            -PciKeyPassword=dropshare-ci

      - name: Verify generated APKs exist
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DropShare-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload installable CI release APK
        uses: actions/upload-artifact@v4
        with:
          name: DropShare-installable-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload mapping file
        uses: actions/upload-artifact@v4
        with:
          name: DropShare-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 30
